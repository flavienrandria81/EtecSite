spring.application.name=visio

spring.config.import=configserver:http://localhost:8888

# =========================
# SÉCURITÉ JWT
# =========================
# Secret et expiration (doivent être identiques à ceux de l'utilisateur-service)
jwt.secret=secret-key
jwt.expiration=86400000

# =========================
# TURN (optionnel — visio derrière un NAT strict)
# =========================
visio.turn-url=
visio.turn-username=
visio.turn-password=
